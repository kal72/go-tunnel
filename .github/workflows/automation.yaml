name: Automation (Quality & Security Checks)

on:
  pull_request:
    branches: [ "dev" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ================= UNIT TESTING & COVERAGE COMMENTER =================
  unit-test:
    name: 🧪 Unit Testing (-race)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # Required for posting PR coverage report comments
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v7

      - name: Setup Go Environment
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Execute Unit Tests & Capture Logs
        run: |
          echo "::group::Running Unit Tests & Race Detector"
          set -o pipefail
          go test -v -race -timeout 5m -coverprofile=coverage.out \
            $(go list ./internal/infrastructure... ./internal/usecase... ./internal/delivery... | grep -v "/mocks") \
            2>&1 | tee test_output.log
          echo "::endgroup::"

      - name: Generate Markdown Summary Report
        id: summary
        run: |
          TOTAL=$(go tool cover -func=coverage.out | grep total | awk '{print $3}')
          TOTAL_NUM=$(echo "$TOTAL" | tr -d '%')
          echo "total=$TOTAL" >> $GITHUB_OUTPUT

          # Determine coverage badge color
          if awk "BEGIN { exit !($TOTAL_NUM >= 80) }"; then
            BADGE="🟢 $TOTAL"
          elif awk "BEGIN { exit !($TOTAL_NUM >= 60) }"; then
            BADGE="🟡 $TOTAL"
          else
            BADGE="🔴 $TOTAL"
          fi

          SUMMARY_FILE="coverage_report.md"
          echo "### 🧪 Unit Test Coverage Report" > $SUMMARY_FILE
          echo "" >> $SUMMARY_FILE
          echo "**Overall Coverage:** $BADGE" >> $SUMMARY_FILE
          echo "" >> $SUMMARY_FILE
          echo "| Status | Package | Coverage |" >> $SUMMARY_FILE
          echo "| :---: | :--- | :---: |" >> $SUMMARY_FILE

          # Parse package results: lines matching "ok" or "FAIL" from go test -v output
          # Format: "ok  <pkg>  <duration>  coverage: X% of statements"
          # Format: "FAIL  <pkg>  <duration>"
          grep -E "^(ok|FAIL)[[:space:]]" test_output.log | while read -r line; do
            STATUS_RAW=$(echo "$line" | awk '{print $1}')
            PKG=$(echo "$line" | awk '{print $2}' | sed 's|gotunnel/internal/||')
            COV=$(echo "$line" | sed -n 's/.*coverage: \([0-9.]*%\) of statements.*/\1/p')
            if [ "$STATUS_RAW" = "ok" ]; then
              STATUS="✅"
              COV_CELL="${COV:--}"
            else
              STATUS="❌"
              COV_CELL="${COV:--}"
            fi
            echo "| $STATUS | \`$PKG\` | $COV_CELL |" >> $SUMMARY_FILE
          done

          echo "" >> $SUMMARY_FILE
          echo "---" >> $SUMMARY_FILE
          echo "_🟢 ≥80%  🟡 ≥60%  🔴 <60%_" >> $SUMMARY_FILE

          cat $SUMMARY_FILE >> $GITHUB_STEP_SUMMARY

      - name: Comment Coverage on PR (Sticky Comment)
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('coverage_report.md', 'utf8');
            
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            
            const botComment = comments.find(c => c.user.type === 'Bot' && c.body.includes('Unit Test Coverage Report'));
            
            if (botComment) {
              console.log("Updating existing bot comment ID:", botComment.id);
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: report
              });
            } else {
              console.log("Creating new bot comment...");
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: report
              });
            }

  # ================= 3. GOVULNCHECK =================
  govulncheck:
    name: 🛡️ Govulncheck (Vulnerability Scanner)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v7

      - name: Setup Go Environment
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck & Build Summary
        run: |
          echo "## 🛡️ Govulncheck — Vulnerability Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Run govulncheck, capture output, allow non-zero exit (vulnerabilities found)
          set +e
          OUTPUT=$(govulncheck ./... 2>&1)
          EXIT_CODE=$?
          set -e

          if [ $EXIT_CODE -eq 0 ]; then
            echo "✅ **No vulnerabilities found.**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "> All dependencies are clean. No known vulnerabilities detected." >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ **Vulnerabilities detected!**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "$OUTPUT" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

          # Print to console log as well
          echo "$OUTPUT"

          # Fail the job if vulnerabilities were found
          exit $EXIT_CODE

  # ================= 4. GOLANGCI-LINT =================
  golangci-lint:
    name: 🔍 GolangCI-Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write  # Required for inline PR annotations
      checks: write         # Required for GitHub check run annotations
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v7

      - name: Setup Go Environment
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache: false

      - name: Run GolangCI-Lint Action
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12
          args: --timeout=5m

      - name: Write Step Summary
        if: always()
        run: |
          echo "## 🔍 GolangCI-Lint Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ job.status }}" = "success" ]; then
            echo "✅ **No lint issues found.** All checks passed." >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ **Lint issues detected!** Please check the inline PR annotations in the *Files Changed* tab." >> $GITHUB_STEP_SUMMARY
          fi

  # ================= BUILD CHECK =================
  build-check:
    name: 🔨 Build Check (Binary Compile Verification)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v7

      - name: Setup Go Environment
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Verify Binary Compilation
        run: |
          echo "::group::Compiling All Go Binaries (Server, Proxy, WebUI, Client)"
          make build
          echo "::endgroup::"

  # ================= CROSS-COMPILE CLIENT BINARIES =================
  cross-compile:
    name: 🌐 Cross-Compile Client (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v7

      - name: Setup Go Environment
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Compile Client Binary (${{ matrix.goos }}/${{ matrix.goarch }})
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          echo "::group::Cross-compiling client for ${{ matrix.goos }}/${{ matrix.goarch }}"
          go build -o /dev/null ./cmd/client/main.go
          echo "✅ Build succeeded: ${{ matrix.goos }}/${{ matrix.goarch }}"
          echo "::endgroup::"