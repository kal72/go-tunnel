{{define "content"}}
<div x-data="domainsApp()" x-init="init()" x-cloak class="flex flex-col h-full">
  <!-- Top Header -->
  <header class="h-14 border-b border-gray-100 flex items-center justify-between px-6 bg-white shrink-0">
    <div class="flex items-center gap-3">
      <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center">
        <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9m-9 9a9 9 0 019-9" />
        </svg>
      </div>
      <h1 class="text-sm font-semibold tracking-tight">Domain Management</h1>
    </div>
    <div class="flex items-center gap-4">
      <a href="/" class="text-xs font-medium text-blue-600 hover:text-blue-700 bg-blue-50 px-3 py-1.5 rounded-lg border border-blue-100 transition-colors">
        Dashboard
      </a>
      <a href="/configs" class="text-xs font-medium text-blue-600 hover:text-blue-700 bg-blue-50 px-3 py-1.5 rounded-lg border border-blue-100 transition-colors">
        Manage Configs
      </a>
      <a href="/logout" class="text-xs font-medium text-red-600 hover:text-red-700 bg-red-50 px-3 py-1.5 rounded-lg border border-red-100 transition-colors">
        Logout
      </a>
    </div>
  </header>

  <!-- Main Content -->
  <main class="flex-1 overflow-auto p-6 bg-gray-50/50">
    <div class="max-w-4xl mx-auto">
      <div class="mb-6">
        <h2 class="text-xl font-bold text-gray-900">Allowed Domains</h2>
        <p class="text-sm text-gray-500 mt-1">Manage subdomains or custom external domains.</p>
        <div class="mt-2 inline-flex items-center gap-2 px-3 py-1 bg-blue-50 text-blue-700 border border-blue-100 rounded-full text-xs font-mono">
            <span>Base Domain:</span>
            <span class="font-bold" x-text="wildcardBase || 'Loading...'"></span>
        </div>
      </div>

      <!-- Add Domain Card -->
      <div class="bg-white border border-gray-200 rounded-xl shadow-sm p-5 mb-6">
        <div class="flex flex-col gap-4">
            <div class="flex gap-3">
              <div class="flex-1 relative">
                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                  <svg class="h-4 w-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1" />
                  </svg>
                </div>
                <input type="text" x-model="newPrefix" :disabled="autoGen"
                  class="block w-full pl-10 pr-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-blue-500 focus:border-blue-500 disabled:bg-gray-50 disabled:text-gray-400" 
                  placeholder="Subdomain or Full Domain (e.g. app-staging or example.com)">
              </div>
              <button @click="addDomain()" 
                class="inline-flex items-center px-4 py-2 border border-transparent text-sm font-medium rounded-lg shadow-sm text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-colors">
                Add Domain
              </button>
            </div>
            
            <div class="flex items-center gap-2">
                <input type="checkbox" id="autogen" x-model="autoGen" class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300 rounded">
                <label for="autogen" class="text-sm text-gray-700 font-medium cursor-pointer">Auto-generate random subdomain string</label>
            </div>
            
            <div x-show="!autoGen" class="p-3 bg-amber-50 border border-amber-100 rounded-lg">
                <p class="text-xs text-amber-700">
                    <strong>Preview:</strong> <span class="font-mono" x-text="newPrefix.includes('.') ? newPrefix : (newPrefix || 'sub') + '.' + (wildcardBase ? wildcardBase.replace('*.', '') : 'domain.com')"></span>
                </p>
            </div>
        </div>
      </div>

      <!-- Domains Table -->
      <div class="bg-white border border-gray-200 rounded-xl shadow-sm overflow-hidden relative">
        <!-- Loading Overlay -->
        <div x-show="loading" class="absolute inset-0 bg-white/60 flex items-center justify-center z-10 backdrop-blur-sm">
          <svg class="animate-spin h-6 w-6 text-blue-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
        </div>

        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="bg-gray-50 border-b border-gray-200">
              <th class="px-6 py-3 text-xs font-semibold text-gray-600 uppercase tracking-wider">Domain</th>
              <th class="px-6 py-3 text-xs font-semibold text-gray-600 uppercase tracking-wider">Type</th>
              <th class="px-6 py-3 text-xs font-semibold text-gray-600 uppercase tracking-wider text-right">Actions</th>
            </tr>
          </thead>
          <tbody class="divide-y divide-gray-100">
            <template x-for="domain in domains" :key="domain">
              <tr class="hover:bg-gray-50 transition-colors group">
                <td class="px-6 py-4">
                  <span class="text-sm font-medium text-gray-900 font-mono" x-text="domain"></span>
                </td>
                <td class="px-6 py-4">
                  <span x-show="domain.includes('.')" 
                    class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-blue-100 text-blue-800 border border-blue-200">
                    Authorized
                  </span>
                </td>
                <td class="px-6 py-4 text-right">
                  <button @click="removeDomain(domain)" 
                    class="text-gray-400 hover:text-red-600 transition-colors p-1 rounded-md hover:bg-red-50 focus:outline-none"
                    title="Remove Domain">
                    <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                    </svg>
                  </button>
                </td>
              </tr>
            </template>
            <tr x-show="domains.length === 0 && !loading">
              <td colspan="3" class="px-6 py-12 text-center">
                <div class="flex flex-col items-center">
                  <div class="w-12 h-12 bg-gray-100 rounded-full flex items-center justify-center mb-3">
                    <svg class="w-6 h-6 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9m-9 9a9 9 0 019-9" />
                    </svg>
                  </div>
                  <p class="text-sm text-gray-500">No domains registered. Create one above to get started.</p>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
      
    </div>
  </main>
</div>

<script>
  function domainsApp() {
    return {
      domains: [],
      newPrefix: '',
      autoGen: false,
      wildcardBase: '',
      loading: true,

      async init() {
        await this.fetchDomains();
      },

      async fetchDomains() {
        this.loading = true;
        try {
          const res = await fetch('/api/domains');
          if (res.ok) {
            const data = await res.json();
            this.domains = data.domains || [];
            this.wildcardBase = data.wildcard_domain || '';
            this.domains.sort(); 
          }
        } catch (e) {
          console.error("Failed to fetch domains", e);
        } finally {
          this.loading = false;
        }
      },

      async addDomain() {
        if (!this.autoGen && !this.newPrefix) return;
        
        try {
          const res = await fetch('/api/domains', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ 
                prefix: this.newPrefix,
                random: this.autoGen
            })
          });
          
          if (res.ok) {
            this.newPrefix = '';
            await this.fetchDomains();
          } else {
            const err = await res.text();
            alert(`Failed to add domain: ${err}`);
          }
        } catch (e) {
          alert(`Error: ${e.message}`);
        }
      },

      async removeDomain(domain) {
        if (!confirm(`Are you sure you want to remove ${domain}?`)) {
          return;
        }
        
        try {
          const res = await fetch(`/api/domains/${encodeURIComponent(domain)}`, {
            method: 'DELETE'
          });
          
          if (res.ok) {
            await this.fetchDomains();
          } else {
            const err = await res.text();
            alert(`Failed to remove domain: ${err}`);
          }
        } catch (e) {
          alert(`Error: ${e.message}`);
        }
      }
    };
  }
</script>
{{end}}
