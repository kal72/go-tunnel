{{define "content"}}
<div x-data="statsDashboard()" x-init="init()"
     class="w-full max-w-6xl mx-auto p-6 md:p-8 space-y-8"
     style="width: 100%; max-width: 72rem; margin-left: auto; margin-right: auto; box-sizing: border-box; display: flex; flex-direction: column; gap: 2rem;">

  <!-- Header Section -->
  <div class="w-full flex flex-col md:flex-row md:items-center justify-between gap-4 pb-6 border-b border-gray-200 dark:border-slate-800"
       style="width: 100%; box-sizing: border-box;">
    <div>
      <div class="flex items-center gap-3">
        <div class="p-2.5 bg-teal-500/10 dark:bg-teal-500/20 text-teal-600 dark:text-teal-400 rounded-xl border border-teal-500/20 shadow-sm">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" />
          </svg>
        </div>
        <div>
          <h1 class="text-2xl font-bold tracking-tight text-gray-900 dark:text-white">System Statistics</h1>
          <p class="text-sm text-gray-500 dark:text-gray-400">Real-time resource utilization and network throughput monitoring</p>
        </div>
      </div>
    </div>

    <!-- Live Connection Status -->
    <div class="flex items-center gap-3 px-4 py-2 bg-white dark:bg-slate-800/80 rounded-xl border border-gray-200/80 dark:border-slate-700/80 shadow-sm self-start md:self-center">
      <span class="relative flex h-3 w-3">
        <span x-show="connected" class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
        <span class="relative inline-flex rounded-full h-3 w-3 transition-colors duration-300" :class="connected ? 'bg-emerald-500' : 'bg-rose-500'"></span>
      </span>
      <!-- w-32 agar teks Live/Disconnected tidak mengubah lebar badge -->
      <span style="width: 8rem; display: inline-block; box-sizing: border-box;"
            class="text-xs font-semibold uppercase tracking-wider text-gray-600 dark:text-gray-300"
            x-text="connected ? 'Live (5s Refresh)' : 'Disconnected'">Live (5s Refresh)</span>
    </div>
  </div>

  <!-- Cards Grid: 3 kolom equal width dengan minmax(0,1fr) dan width 100% agar tidak pernah bergeser -->
  <div class="w-full grid grid-cols-1 md:grid-cols-3 gap-6"
       style="width: 100%; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1.5rem; box-sizing: border-box;">

    <!-- CPU Card -->
    <div class="bg-white dark:bg-slate-800/90 rounded-2xl p-6 border border-gray-200/80 dark:border-slate-700/80 shadow-sm hover:shadow-md transition-shadow duration-300 relative group"
         style="width: 100%; min-width: 0; height: 14rem; overflow: hidden; position: relative; box-sizing: border-box;">
      <div class="absolute -right-6 -bottom-6 w-32 h-32 bg-blue-500/5 dark:bg-blue-500/10 rounded-full blur-2xl group-hover:scale-110 transition-transform duration-500"></div>

      <div class="flex items-center justify-between mb-4">
        <span class="text-sm font-semibold uppercase tracking-wider text-gray-500 dark:text-gray-400">CPU Usage</span>
        <div class="p-2 bg-blue-50 dark:bg-blue-900/30 text-blue-600 dark:text-blue-400 rounded-lg shrink-0">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4" />
          </svg>
        </div>
      </div>

      <div class="space-y-4">
        <div class="h-10 flex items-center" style="height: 2.5rem;">
          <span class="text-4xl font-extrabold tracking-tight text-gray-900 dark:text-white font-mono tabular-nums"
                x-text="stats.cpu_percent.toFixed(1) + '%'">{{.Pre.CPU}}</span>
        </div>
        <!-- Progress Bar -->
        <div class="w-full bg-gray-100 dark:bg-slate-700 h-2.5 rounded-full overflow-hidden" style="width: 100%;">
          <div class="bg-gradient-to-r from-blue-500 to-indigo-600 h-full rounded-full transition-[width] duration-700 ease-out"
               style="width: {{.Pre.CPU}};"
               :style="'width: ' + Math.min(100, Math.max(0, stats.cpu_percent)) + '%'"></div>
        </div>
      </div>
    </div>

    <!-- RAM Card -->
    <div class="bg-white dark:bg-slate-800/90 rounded-2xl p-6 border border-gray-200/80 dark:border-slate-700/80 shadow-sm hover:shadow-md transition-shadow duration-300 relative group"
         style="width: 100%; min-width: 0; height: 14rem; overflow: hidden; position: relative; box-sizing: border-box;">
      <div class="absolute -right-6 -bottom-6 w-32 h-32 bg-purple-500/5 dark:bg-purple-500/10 rounded-full blur-2xl group-hover:scale-110 transition-transform duration-500"></div>

      <div class="flex items-center justify-between mb-4">
        <span class="text-sm font-semibold uppercase tracking-wider text-gray-500 dark:text-gray-400">RAM Usage</span>
        <div class="p-2 bg-purple-50 dark:bg-purple-900/30 text-purple-600 dark:text-purple-400 rounded-lg shrink-0">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" />
          </svg>
        </div>
      </div>

      <div class="space-y-4">
        <div class="h-10 flex items-center justify-between gap-2" style="height: 2.5rem;">
          <span class="text-4xl font-extrabold tracking-tight text-gray-900 dark:text-white font-mono tabular-nums shrink-0"
                x-text="stats.mem_percent.toFixed(1) + '%'">{{.Pre.Mem}}</span>
          <span class="text-xs font-semibold text-gray-500 dark:text-gray-400 font-mono tabular-nums truncate text-right"
                x-text="formatBytes(stats.mem_used) + ' / ' + formatBytes(stats.mem_total)">{{.Pre.MemUsed}}</span>
        </div>
        <!-- Progress Bar -->
        <div class="w-full bg-gray-100 dark:bg-slate-700 h-2.5 rounded-full overflow-hidden" style="width: 100%;">
          <div class="bg-gradient-to-r from-purple-500 to-pink-600 h-full rounded-full transition-[width] duration-700 ease-out"
               style="width: {{.Pre.Mem}};"
               :style="'width: ' + Math.min(100, Math.max(0, stats.mem_percent)) + '%'"></div>
        </div>
      </div>
    </div>

    <!-- Network Card -->
    <div class="bg-white dark:bg-slate-800/90 rounded-2xl p-6 border border-gray-200/80 dark:border-slate-700/80 shadow-sm hover:shadow-md transition-shadow duration-300 relative group"
         style="width: 100%; min-width: 0; height: 14rem; overflow: hidden; position: relative; box-sizing: border-box;">
      <div class="absolute -right-6 -bottom-6 w-32 h-32 bg-teal-500/5 dark:bg-teal-500/10 rounded-full blur-2xl group-hover:scale-110 transition-transform duration-500"></div>

      <div class="flex items-center justify-between mb-4">
        <span class="text-sm font-semibold uppercase tracking-wider text-gray-500 dark:text-gray-400">Network I/O</span>
        <div class="p-2 bg-teal-50 dark:bg-teal-900/30 text-teal-600 dark:text-teal-400 rounded-lg shrink-0">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4" />
          </svg>
        </div>
      </div>

      <!-- Sub-grid dengan width 100% dan minmax(0,1fr) -->
      <div class="w-full grid grid-cols-2 gap-3"
           style="width: 100%; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.75rem; box-sizing: border-box;">
        <!-- Upload -->
        <div class="flex flex-col justify-center p-3 bg-gray-50 dark:bg-slate-800/50 rounded-xl border border-gray-100 dark:border-slate-700/50"
             style="width: 100%; min-width: 0; height: 6rem; overflow: hidden; box-sizing: border-box;">
          <div class="flex items-center gap-1.5 text-xs font-semibold text-emerald-600 dark:text-emerald-400 mb-2">
            <svg class="w-3.5 h-3.5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 10l7-7m0 0l7 7m-7-7v18" />
            </svg>
            <span>Upload</span>
          </div>
          <span class="text-lg font-bold text-gray-900 dark:text-white font-mono tabular-nums truncate"
                x-text="formatRate(stats.net_sent)">{{.Pre.NetSent}}</span>
        </div>

        <!-- Download -->
        <div class="flex flex-col justify-center p-3 bg-gray-50 dark:bg-slate-800/50 rounded-xl border border-gray-100 dark:border-slate-700/50"
             style="width: 100%; min-width: 0; height: 6rem; overflow: hidden; box-sizing: border-box;">
          <div class="flex items-center gap-1.5 text-xs font-semibold text-sky-600 dark:text-sky-400 mb-2">
            <svg class="w-3.5 h-3.5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 14l-7 7m0 0l-7-7m7 7V3" />
            </svg>
            <span>Download</span>
          </div>
          <span class="text-lg font-bold text-gray-900 dark:text-white font-mono tabular-nums truncate"
                x-text="formatRate(stats.net_recv)">{{.Pre.NetRecv}}</span>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  function statsDashboard() {
    return {
      stats: {{.InitialStats}},
      connected: false,
      es: null,
      init() {
        this.connect();
        window.addEventListener('beforeunload', () => this.destroy());
        window.addEventListener('pagehide', () => this.destroy());
      },
      destroy() {
        if (this.es) {
          this.es.close();
          this.es = null;
        }
      },
      connect() {
        if (this.es) this.es.close();
        this.es = new EventSource('/api/stats/stream');
        this.es.onmessage = (event) => {
          try {
            this.stats = JSON.parse(event.data);
            this.connected = true;
          } catch (e) {
            console.error('Failed to parse stats:', e);
          }
        };
        this.es.onerror = () => {
          this.connected = false;
        };
      },
      formatBytes(bytes) {
        if (!bytes || bytes === 0) return '0 B';
        const k = 1024;
        const sizes = ['B', 'KB', 'MB', 'GB', 'TB'];
        const i = Math.floor(Math.log(bytes) / Math.log(k));
        return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
      },
      formatRate(bytesPerSec) {
        return this.formatBytes(bytesPerSec) + '/s';
      }
    };
  }
</script>
{{end}}
