# Kubernetes Deployment & ClusterIP Service for shared Redis state, rate limiters, and active domain locks
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gotunnel-redis
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gotunnel-redis
  template:
    metadata:
      labels:
        app: gotunnel-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
              name: redis
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: gotunnel-redis
  namespace: default
spec:
  type: ClusterIP
  selector:
    app: gotunnel-redis
  ports:
    - port: 6379
      targetPort: 6379
