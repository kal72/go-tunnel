# Kubernetes Deployment (replicas: 3+) & LoadBalancer Service for stateless Edge Proxy pods (`gotunnel-proxy`)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gotunnel-proxy
  namespace: default
spec:
  replicas: 3 # Stateless Edge Proxy, can be scaled horizontally to 20+ pods via HPA without session issues
  selector:
    matchLabels:
      app: gotunnel-proxy
  template:
    metadata:
      labels:
        app: gotunnel-proxy
    spec:
      containers:
        - name: proxy
          image: ghcr.io/kal72/gotunnel:latest
          command: ["./gotunnel-proxy"]
          envFrom:
            - configMapRef:
                name: gotunnel-config
          ports:
            - name: http-public
              containerPort: 80
            - name: https-public
              containerPort: 443
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          livenessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: gotunnel-proxy-lb
  namespace: default
spec:
  type: LoadBalancer # Or NodePort/ClusterIP if using an external Ingress Controller (Nginx Ingress / Traefik)
  selector:
    app: gotunnel-proxy
  ports:
    - name: http-public
      port: 80
      targetPort: 80
    - name: https-public
      port: 443
      targetPort: 443
