# Kubernetes StatefulSet & ClusterIP Service for Core Gateway pods (`gotunnel-tunnel`) handling active Yamux sessions & internal HTTP relay
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: gotunnel-core
  namespace: default
spec:
  serviceName: gotunnel-core
  replicas: 1
  selector:
    matchLabels:
      app: gotunnel-core
  template:
    metadata:
      labels:
        app: gotunnel-core
    spec:
      containers:
        - name: core
          image: ghcr.io/kal72/gotunnel:latest
          command: ["./gotunnel-tunnel"]
          envFrom:
            - configMapRef:
                name: gotunnel-config
          ports:
            - name: gateway-http
              containerPort: 8443
            - name: tunnel-yamux
              containerPort: 9443
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          readinessProbe:
            tcpSocket:
              port: 8443
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8443
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: gotunnel-core
  namespace: default
spec:
  type: ClusterIP
  selector:
    app: gotunnel-core
  ports:
    - name: gateway-http
      port: 8443
      targetPort: 8443
    - name: tunnel-yamux
      port: 9443
      targetPort: 9443
