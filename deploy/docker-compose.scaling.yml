# Docker Compose Example for Horizontal Scaling (Separation of Concerns: Edge Proxy + Core Gateway + Web UI + Redis)
#
# Usage:
# 1. Adjust domain environment variables (GATEWAY_DOMAIN, TUNNEL_DOMAIN, WEBUI_DOMAIN).
# 2. Start the cluster:
#    docker compose -f deploy/docker-compose.scaling.yml up -d
# 3. To horizontally scale out the proxy service to 3 replicas behind an external load balancer:
#    docker compose -f deploy/docker-compose.scaling.yml up --scale proxy=3 -d

services:
  # 1. Storage & State Synchronization Layer
  redis:
    image: redis:7-alpine
    container_name: gotunnel-redis
    restart: always
    volumes:
      - redis_data:/data
    networks:
      - gotunnel-net

  # 2. Core Gateway (Yamux Stream Handler & Internal HTTP Relay)
  core:
    image: ghcr.io/kal72/gotunnel:latest
    container_name: gotunnel-core
    command: ["./gotunnel-tunnel"]
    restart: always
    environment:
      - GATEWAY_DOMAIN=gate.example.com
      - TUNNEL_DOMAIN=tunnel.example.com
      - GATEWAY_PORT=8443
      - TUNNEL_PORT=9443
      - REDIS_ADDR=redis:6379
    # Port 9443 is exposed so remote tunnel agents (client PCs) can connect directly via TCP/Yamux
    ports:
      - "9443:9443"
    depends_on:
      - redis
    networks:
      - gotunnel-net

  # 3. Control Plane Dashboard (Web UI & Token Management)
  webui:
    image: ghcr.io/kal72/gotunnel:latest
    container_name: gotunnel-webui
    command: ["./gotunnel-webui"]
    restart: always
    environment:
      - WEBUI_DOMAIN=app.example.com
      - WEBUI_PORT=8080
      - REDIS_ADDR=redis:6379
    volumes:
      - webui_data:/app/data # SQLite database / configuration storage
    depends_on:
      - redis
    networks:
      - gotunnel-net

  # 4. Stateless Edge Proxy (L4 SNI & L7 HTTP/HTTPS Gatekeeper)
  # Can be scaled out using: docker compose up --scale proxy=3 -d
  proxy:
    image: ghcr.io/kal72/gotunnel:latest
    command: ["./gotunnel-proxy"]
    restart: always
    environment:
      - GATEWAY_DOMAIN=gate.example.com
      - TUNNEL_DOMAIN=tunnel.example.com
      - WEBUI_DOMAIN=app.example.com
      - TUNNEL_TARGET=http://core:8443
      - WEBUI_TARGET=http://webui:8080
      - PROXY_HTTP_PORT=80
      - PROXY_HTTPS_PORT=443
    # Note: If scaling via --scale proxy=3 without a fronting load balancer, avoid static port mappings "80:80".
    # Instead, use port ranges (e.g., "8000-8005:80") or place an external Nginx/Cloudflare Load Balancer in front.
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - core
      - webui
    networks:
      - gotunnel-net

networks:
  gotunnel-net:
    driver: bridge

volumes:
  redis_data:
  webui_data:
